<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>TSB - Real-Time Arrow Teleoperation</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #00a3e0; margin-bottom: 0.25rem; }
    p { color: #94a3b8; margin-top: 0; margin-bottom: 1.5rem; }
    canvas {
      background: #ffffff;
      border: 4px solid #00a3e0;
      border-radius: 12px;
      cursor: crosshair;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }
    .controls {
      margin-top: 1.25rem;
      display: flex;
      gap: 1rem;
    }
    button {
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #clearBtn { background: #334155; color: #f8fafc; }
    #clearBtn:hover { background: #475569; }
    #sendBtn { background: #00a3e0; color: #0f172a; }
    #sendBtn:hover { background: #38bdf8; }
    #status {
      margin-top: 1.25rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Técnico Solar Boat — Teleoperação CNN</h1>
  <p>Desenha uma seta (Cima, Baixo, Esquerda ou Direita) e larga o rato para mover a tartaruga</p>

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="controls">
    <button id="clearBtn">Limpar</button>
    <button id="sendBtn">Enviar Agora</button>
  </div>

  <div id="status">Comando atual: —</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    let drawing = false;

    function resetCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resetCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function endDraw() {
      if (!drawing) return;
      drawing = false;
      sendDrawing();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    window.addEventListener('touchend', endDraw);

    document.getElementById('clearBtn').addEventListener('click', () => {
      resetCanvas();
      statusEl.textContent = 'Comando atual: —';
    });

    document.getElementById('sendBtn').addEventListener('click', sendDrawing);

    async function sendDrawing() {
      const dataUrl = canvas.toDataURL('image/png');
      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl })
        });
        const data = await res.json();
        statusEl.textContent = `Comando inferido: ${data.command}`;
        // Limpa automaticamente após 0.8s para poderes desenhar logo a próxima seta
        setTimeout(resetCanvas, 800);
      } catch (err) {
        statusEl.textContent = 'Erro de ligação ao vision_node';
      }
    }
  </script>
</body>
</html>
